[project]
name = "agent-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Swastideep Maharana", email = "swastideep67maharana@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=1.30.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-engine = "agent_engine:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly]
search-path = ["src"]
site-packages-path = [".venv/Lib/site-packages"]

